<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

<body>

    <header class="header">
        <div class="logo">
            <img src="/img/icon.svg" alt="Logo">

        <nav class="nav">
            <a href="/info/en/services">Services</a>
            <a href="/info/en/buy">Hire Services</a>

            <a href="/info/compra" class="lang-btn">🇪🇸</a>

    <section class="buy-container">

        <h1>Hire services</h1>
        <p class="subtitle">Let us know what you need and we wil get in touch with you</p>

        <form class="form">

            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">

            <select>
                <option>Management system</option>
                <option>Corporate website</option>
                <option>API backend</option>
            </select>

            <textarea rows="5" placeholder="Describe your project"></textarea>

            <button class="btn-primary" type="submit">
                Request a price quote
            </button>

        </form>

    </section>
