<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Cena Popular</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="sidebar">

        <div class="sidebar-title">
            🍽️ Cena Popular
        </div>

        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/eventos/nuevo}">Crear Evento</a>
        <a th:href="@{/admin/eventos}">Listar Eventos</a>

        <div style="margin-top: auto;"></div>

        <form th:action="@{/logout}" method="post" style="padding: 10px 20px;">
            <button class="btn" style="width:100%;">
                Cerrar sesión
            </button>
        </form>
    </div>

    <div class="main-content">

        <div class="card">

            <div class="container" style="display:flex; justify-content:space-between; align-items:center;">

                <div>
                    <h1>Panel de Administración</h1>
                    <p>Gestiona eventos, mesas y reservas</p>
                </div>

                <form th:action="@{/logout}" method="post">
                    <button class="btn">Cerrar sesión</button>
                </form>

            </div>

        </div>

        <div class="container" style="margin-top:20px;">

            <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px;">

                <div class="card">
                    <h3>Crear Evento</h3>
                    <p>Crea nuevos eventos y genera automáticamente todas las mesas.</p>
                    <a th:href="@{/admin/eventos/nuevo}">
                        <button class="btn">Ir a crear</button>
                    </a>
                </div>

                <div class="card">
                    <h3>Listado de Eventos</h3>
                    <p>Consulta eventos, mesas y gestión completa.</p>
                    <a th:href="@{/admin/eventos}">
                        <button class="btn">Ver eventos</button>
                    </a>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
